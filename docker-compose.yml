services:
  postgres:
    image: postgres:15
    container_name: sql-database-mastery
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sql_mastery}
      POSTGRES_USER: ${POSTGRES_USER:-sql_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sql_lab} -d ${POSTGRES_DB:-sql_mastery}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
